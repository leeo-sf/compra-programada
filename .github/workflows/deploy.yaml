name: Deploy

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: compra-programada-api

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAIN_BYPASS_TOKEN }}

      - name: Read Current Version
        id: versioning
        run: |
          TARGETS_PATH="VERSION.targets"
          
          CURRENT_VERSION=$(grep -oP '(?<=<Version>)[^<]+' $TARGETS_PATH)

          echo "Versão para este deploy: $CURRENT_VERSION"
          
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          NEW_PATCH=$((patch + 1))
          NEW_MINOR=$minor
          NEW_MAJOR=$major

          # REGRA ESPECIAL: Se o patch passar de 99, vira o Major/Minor
          # Exemplo para 0.0.99 -> 1.0.0
          if [ $NEW_PATCH -gt 99 ]; then
            NEW_PATCH=0
            NEW_MINOR=0
            NEW_MAJOR=$((major + 1))
          fi

          DEPLOY_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          echo "Versão atual: $CURRENT_VERSION -> Próxima versão: DEPLOY_VERSION"
          
          echo "deploy_version=$DEPLOY_VERSION" >> $GITHUB_OUTPUT
          echo "old_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "targets_path=$TARGETS_PATH" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.versioning.outputs.deploy_version }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Update VERSION.targets File
        run: |
          PATH_FILE="${{ steps.versioning.outputs.targets_path }}"
          OLD_V="${{ steps.versioning.outputs.old_version }}"
          NEW_V="${{ steps.versioning.outputs.deploy_version }}"
          
          sed -i "s/<Version>$OLD_V<\/Version>/<Version>$NEW_V<\/Version>/" $PATH_FILE

      - name: Commit and Push Next Version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add ${{ steps.versioning.outputs.targets_path }}
          git commit -m "chore: bump version to ${{ steps.versioning.outputs.deploy_version }} for next release [skip ci]"
          git push